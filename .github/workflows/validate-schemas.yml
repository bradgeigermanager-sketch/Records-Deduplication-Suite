name: Validate record schemas

on:
  push:
    paths:
      - "schemas/**"
      - "examples/**"
      - ".github/workflows/validate-schemas.yml"
  pull_request:
    paths:
      - "schemas/**"
      - "examples/**"
      - ".github/workflows/validate-schemas.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install JSON Schema validator
        run: python -m pip install jsonschema
      - name: Check schemas and assessment example
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from jsonschema import Draft202012Validator, FormatChecker

          schema_paths = [
              Path("schemas/deduplication-record-ir.schema.json"),
              Path("schemas/record-relationship-assessment.schema.json"),
          ]
          for path in schema_paths:
              schema = json.loads(path.read_text(encoding="utf-8"))
              Draft202012Validator.check_schema(schema)
              print(f"Schema valid: {path}")

          assessment_schema = json.loads(
              Path("schemas/record-relationship-assessment.schema.json").read_text(encoding="utf-8")
          )
          example = json.loads(
              Path("examples/relationship-assessment-independent-observations.json").read_text(encoding="utf-8")
          )
          validator = Draft202012Validator(
              assessment_schema, format_checker=FormatChecker()
          )
          validator.validate(example)
          print("Assessment example valid.")

          invalid_example = dict(example)
          invalid_example["deduplication_eligibility"] = "ELIGIBLE"
          try:
              validator.validate(invalid_example)
          except Exception:
              print("Invalid independent-observation assessment rejected.")
          else:
              raise AssertionError(
                  "Independent observations must not be marked eligible for deduplication."
              )
          PY
